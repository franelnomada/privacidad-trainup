<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - TrainUp</title>
  <style>
    :root {
      --primary-color: #7C4DFF;
      --accent-color: #B2FF59;
      --bg-color: #121212;
      --card-bg: #1E1E24;
      --text-color: #E0E0E0;
      --text-muted: #A0A0A0;
      --border-color: #2A2A32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 90%;
      padding: 40px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    h1 {
      color: #FFFFFF;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .btn-email {
      display: inline-block;
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.4);
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-email:hover {
      background-color: #6538e2;
      transform: translateY(-2px);
    }

    .email-text {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Contactar con Soporte</h1>
    <p>¿Necesitas ayuda con TrainUp o tienes alguna consulta? Haz clic en el botón para abrir tu aplicación de correo.</p>
    
    <a href="mailto:gettrainup@gmail.com" class="btn-email">Enviar Correo</a>

    <div class="email-text">
      gettrainup@gmail.com
    </div>
  </div>

</body>
</html>
